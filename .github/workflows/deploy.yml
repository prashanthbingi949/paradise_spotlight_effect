name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Optimize hero image
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/Warrior_Image.jpg")
          if src.exists():
              image = Image.open(src).convert("RGB")
              image.save(
                  src,
                  "JPEG",
                  quality=78,
                  optimize=True,
                  progressive=True,
                  subsampling="4:2:0",
              )
              print(f"Optimized hero image to {src.stat().st_size / 1024:.0f} KB")
          else:
              raise SystemExit("assets/Warrior_Image.jpg not found")

          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
